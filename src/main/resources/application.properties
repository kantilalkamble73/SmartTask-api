spring.application.name=smart-task-backend

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_task_db
spring.datasource.username=postgres
spring.datasource.password=postgre123
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------- Server ----------
server.port=8080

# ---------- JWT ----------
jwt.secret=SmartTaskManagementSystemSuperSecretKeyForJWTSigning2024MustBeLongEnough
jwt.expiration-ms=86400000

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.smarttask=DEBUG
